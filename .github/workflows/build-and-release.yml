name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.29.0'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows with dependencies
        shell: pwsh
        run: |
          # Create release directory
          New-Item -ItemType Directory -Force -Path release/prompt_memo_windows

          # Copy all build files
          Copy-Item -Path "build/windows/x64/runner/Release/*" -Destination "release/prompt_memo_windows/" -Recurse

          # Note: sqlite_common_ffi usually includes sqlite3.dll automatically
          # But we verify it exists in output

          # Create zip archive
          Compress-Archive -Path "release/prompt_memo_windows/*" -DestinationPath "release/prompt_memo_windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/prompt_memo_windows.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            liblzma-dev \
            libblkid-dev \
            libsqlite3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux with dependencies
        run: |
          # Create release directory
          mkdir -p release/prompt_memo_linux

          # Copy bundle
          cp -r build/linux/x64/release/bundle/* release/prompt_memo_linux/

          # Copy sqlite3 library
          cp /lib/x86_64-linux-gnu/libsqlite3.so.0 release/prompt_memo_linux/

          # Create startup script that sets library path
          cat > release/prompt_memo_linux/run.sh << 'EOF'
          #!/bin/bash
          # Get the directory where this script is located
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          # Add current directory to library path and run the app
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          exec "$DIR/prompt_memo"
          EOF
          chmod +x release/prompt_memo_linux/run.sh

          # Create tar.gz archive
          cd release
          tar -czf prompt_memo_linux.tar.gz prompt_memo_linux/

      - name: Create README for Linux
        run: |
          cat > release/README_LINUX.md << 'EOF'
          # Prompt Memo - Linux 安装说明

          ## 方法1：使用启动脚本（推荐）

          1. 解压 `prompt_memo_linux.tar.gz`
          2. 进入解压后的目录
          3. 运行：`./run.sh`

          ## 方法2：手动设置库路径

          1. 解压 `prompt_memo_linux.tar.gz`
          2. 进入解压后的目录
          3. 运行：
             ```
             LD_LIBRARY_PATH=. ./prompt_memo
             ```

          ## 方法3：安装sqlite3（系统级）

          Ubuntu/Debian:
          ```bash
          sudo apt-get install sqlite3 libsqlite3-dev
          ```

          Fedora/RHEL:
          ```bash
          sudo dnf install sqlite3 sqlite-devel
          ```

          Arch Linux:
          ```bash
          sudo pacman -S sqlite
          ```

          安装后可以直接运行 `./prompt_memo`
          EOF

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: release/prompt_memo_linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Release Notes
        id: generate_release_notes
        run: |
          # Get the current tag
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"

          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "This is the first release"
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
            echo "Generating notes for commits from $PREVIOUS_TAG to $CURRENT_TAG"
          fi

          # Get commits since previous tag
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$CURRENT_TAG" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" "$RANGE" --no-merges)
          fi

          # Get the tag message (annotation)
          TAG_MESSAGE=$(git tag -l --format='%(contents:subject)' "$CURRENT_TAG")

          # Generate release notes
          cat > release_notes.md << EOF
          ## Prompt Memo $CURRENT_TAG

          ### 📝 Tag Message
          $TAG_MESSAGE

          ### 📦 What's Changed

          EOF

          # Add commits to release notes
          if [ -n "$COMMITS" ]; then
            echo "$COMMITS" >> release_notes.md
          else
            echo "- Initial release" >> release_notes.md
          fi

          # Add footer
          cat >> release_notes.md << EOF

          ### 📦 Download

          #### Android (.apk)
          - 直接下载并安装，无需额外依赖

          #### Windows (.zip)
          - 解压后运行 `prompt_memo.exe`
          - 如遇缺少 DLL 错误，请安装 [VC++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe)

          #### Linux (.tar.gz)
          - 解压后运行 `./run.sh`
          - 详细说明见 `README_LINUX.md`

          ---
          *Full Changelog: https://github.com/Q-Bug4/prompt-memo/commits/$CURRENT_TAG*
          EOF

          # Save to file for next step
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-apk/app-release.apk
            windows-exe/prompt_memo_windows.zip
            linux-bundle/prompt_memo_linux.tar.gz
          body_file: release_notes.md
          draft: false
          prerelease: false
